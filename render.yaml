services:
  - type: web
    name: kisansathi-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/kisansathi.db
      - key: AI_PROVIDER
        value: curated
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
