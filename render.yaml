services:
  - type: web
    name: kisansathi-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/kisansathi.db
      - key: AI_PROVIDER
        value: demo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
    disk:
      name: kisansathi-data
      mountPath: /var/data
      sizeGB: 1
